name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: RSpec + Cucumber
    runs-on: ubuntu-latest

    env:
      RACK_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true   # runs bundle install and caches gems

      - name: RSpec
        run: bundle exec rspec --format progress

      - name: Cucumber
        run: bundle exec cucumber --format progress
